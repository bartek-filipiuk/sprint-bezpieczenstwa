server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # The checkout form posts to courses.devince.dev, which answers 303 to Stripe Checkout;
    # browsers apply form-action to the redirect target too, so both origins are listed.
    # Umami (stats.67projects.app) is allowed for when the site id is added.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.67projects.app; connect-src 'self' https://stats.67projects.app; img-src 'self' data:; style-src 'self'; font-src 'self'; form-action 'self' https://courses.devince.dev https://checkout.stripe.com https://devince.dev; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fonts never change name; CSS changes rarely and is small.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*";
    }
    location ~* \.(css|svg)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. { deny all; }
}
